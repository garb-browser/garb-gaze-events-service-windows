name: Build and Release

on:
  push:
    branches: [garb-christian, master, main]
    tags:
      - 'v*'
  pull_request:
    branches: [garb-christian, master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore WindowsEyeServer.sln

    - name: Build x64 Release
      run: msbuild WindowsEyeServer.sln /p:Configuration=Release /p:Platform=x64 /v:minimal

    - name: Create Release Package
      shell: cmd
      run: |
        mkdir release-package
        xcopy /E /I /Y bin\x64\Release\* release-package\
        if exist packages\Tobii.Interaction.0.7.1\build\x64\Tobii.EyeX.Client.dll (
          copy /Y packages\Tobii.Interaction.0.7.1\build\x64\Tobii.EyeX.Client.dll release-package\
        )

    - name: Install Inno Setup
      run: choco install innosetup -y --no-progress

    - name: Prepare installer source
      shell: cmd
      run: |
        mkdir installer\publish
        xcopy /E /I /Y release-package\* installer\publish\

    - name: Compile Installer
      shell: cmd
      run: |
        "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\garb-installer.iss

    - name: Upload Build Artifact (ZIP)
      uses: actions/upload-artifact@v4
      with:
        name: GARB-Eye-Tracking-Service
        path: release-package/
        retention-days: 30

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GARB-Eye-Tracking-Service-Installer
        path: installer/output/GARB-Eye-Tracking-Service-Setup.exe
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download ZIP artifact
      uses: actions/download-artifact@v4
      with:
        name: GARB-Eye-Tracking-Service
        path: release-package

    - name: Download Installer artifact
      uses: actions/download-artifact@v4
      with:
        name: GARB-Eye-Tracking-Service-Installer
        path: installer-output

    - name: Create ZIP
      run: |
        cd release-package
        zip -r ../GARB-Eye-Tracking-Service-${{ github.ref_name }}.zip .

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          GARB-Eye-Tracking-Service-${{ github.ref_name }}.zip
          installer-output/GARB-Eye-Tracking-Service-Setup.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
